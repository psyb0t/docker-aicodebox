[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aicodebox"
version = "0.18.2"
description = "Agent-agnostic base for aicodebox images (adapter contract + api/telegram/cron/mcp modes)"
license = { text = "WTFPL" }
requires-python = ">=3.12"
authors = [{ name = "psyb0t" }]
dependencies = [
    "pyyaml==6.0.3",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "python-telegram-bot==22.8",
    "croniter==6.2.4",
    "mcp==1.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aicodebox"]
exclude = ["aicodebox/tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
exclude-newer = "2026-10-12T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["aicodebox/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
